<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Płynność – trening</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #6b7280;
    --line: #e5e1d8; --accent: #2f6f5e; --accent-soft: #e3efea; --accent-ink: #ffffff;
    --warn: #b4551d; --done: #d9efe5; --soft: #f1efe8;
    --tab-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45; font-size: 16px;
    padding-bottom: calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px));
  }
  main { padding: 0 12px 24px; max-width: 560px; margin: 0 auto; }
  .screen { display: none; }
  .screen.on { display: block; }
  :focus-visible { outline: 3px solid #7fb3a3; outline-offset: 2px; }
  header.top { padding: 18px 0 8px; }
  header.top h1 { margin: 0; font-size: 22px; }
  header.top p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .daynav .arrow { width: 44px; height: 44px; padding: 0; background: var(--card); color: var(--ink); border: 1px solid var(--line); font-size: 22px; }
  .daynav .arrow:disabled { opacity: .35; }
  .daynav .mid { flex: 1; text-align: center; }
  .daynav .mid h1 { font-size: 20px; }

  .progress { display: flex; gap: 6px; margin: 12px 0 6px; }
  .progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); transition: background .3s; }
  .progress span.on { background: var(--accent); }
  .next { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 14px; font-size: 15px; color: var(--muted); }
  .next strong { color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card.done { background: var(--done); border-color: #c5e3d4; }
  .card.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card h2 { margin: 0; font-size: 18px; }
  .card h3 { margin: 14px 0 6px; font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .card p { margin: 6px 0; }
  .chead { display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 44px; border-radius: 8px; }
  .chead .mark { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--accent); background: #fff; }
  .card.done .chead .mark { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card.current .chead .mark { border-color: var(--accent); }
  .chead .t { flex: 1; min-width: 0; }
  .chead small { display: block; color: var(--muted); font-size: 14px; margin-top: 1px; }
  .chead .act { flex-shrink: 0; min-height: 44px; padding: 8px 12px; font-size: 15px; }
  .cbody { margin-top: 10px; }
  .card.collapsed .cbody { display: none; }
  .brief { margin: 0 0 10px; padding: 0; list-style: none; font-size: 15px; color: #2b3036; }
  .brief li { padding: 3px 0; }
  .brief b { color: var(--accent); font-weight: 600; }
  .brief li.no b { color: var(--warn); }
  .ins { background: var(--soft); border-radius: 12px; padding: 4px 12px; margin: 10px 0 0; }
  .ins .ln { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: #2b3036; }
  .ins .ln b { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin-bottom: 2px; }
  .ins .ln.no b { color: var(--warn); }
  .ins details { padding: 2px 0 6px; font-size: 15px; }
  .ins summary { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; min-height: 44px; display: flex; align-items: center; list-style: none; }
  .ins summary::-webkit-details-marker { display: none; }
  .ins summary::before { content: '+'; display: inline-block; width: 18px; font-size: 18px; color: var(--accent); }
  .ins details[open] summary::before { content: '–'; }
  .ins details p { margin: 4px 0 6px; color: #2b3036; }
  .instoggle { width: 100%; margin-top: 10px; background: transparent; color: var(--accent); border: 1px dashed var(--accent); font-weight: 600; }
  .note { font-size: 14px; color: var(--muted); }
  .enc { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0 0; font-size: 15px; }
  .enc strong { color: var(--accent); }
  .saved { font-size: 14px; color: var(--accent); min-height: 20px; margin-top: 4px; }

  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; min-height: 44px; min-width: 44px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.plain { background: var(--soft); color: var(--ink); }
  button.big { width: 100%; font-size: 18px; min-height: 56px; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .row > button { flex: 1; }
  .row > button.ghost, .row > button.plain { flex: 0 0 auto; }

  /* Timer */
  .timer { text-align: center; padding: 6px 0 4px; }
  .timer .cue { font-size: 34px; font-weight: 700; min-height: 44px; line-height: 1.2; word-break: break-word; }
  .timer .cue.small { font-size: 22px; color: var(--muted); font-weight: 600; }
  .timer .sub { color: var(--muted); font-size: 15px; min-height: 44px; } /* 2 linie: podpowiedź 1- albo 2-liniowa nie przesuwa kart pod spodem */
  .timer .clock { font-variant-numeric: tabular-nums; font-size: 48px; font-weight: 700; margin: 4px 0; line-height: 1.1; }
  .timer .reps { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
  .timer .reps b { color: var(--ink); font-size: 17px; }
  .timer .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 12px; overflow: hidden; }
  .timer .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s linear; }
  .timer.gap .clock { color: var(--muted); }
  .timer .words { font-size: 15px; color: var(--ink); margin: 0 0 10px; line-height: 1.35; }
  .timer .words b { color: var(--muted); font-weight: 600; }
  .bgroup { margin-top: 2px; }
  .topic .langnote { flex: 1; margin: 0; }
  .bgroup .srlabel { margin-top: 10px; }

  /* SR picker: 9 chips in a 5+4 grid, each >= 44x44 */
  .sr { margin-top: 6px; }
  .sr .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .sr .chip { min-height: 46px; min-width: 44px; padding: 0; border-radius: 10px; font-size: 17px; font-weight: 700; background: #fff; border: 2px solid var(--c); color: var(--c); }
  .sr .chip.on { background: var(--c); color: #fff; }
  .sr .meaning { font-size: 14px; color: var(--muted); margin-top: 6px; min-height: 20px; }
  .sr .meaning b { color: var(--ink); }
  .srlabel { font-size: 15px; font-weight: 600; margin-top: 12px; }
  .srkey { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 8px; padding: 8px 10px; background: var(--soft); border-radius: 10px; font-size: 14px; color: var(--muted); }
  .srkey span { display: flex; align-items: center; gap: 6px; line-height: 1.25; }
  .srkey i { flex-shrink: 0; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .srkey b { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 24px; white-space: nowrap; flex-shrink: 0; } /* „4–5” nie łamie się */
  .srkey span.on { color: var(--ink); font-weight: 600; }

  /* Start na sygnał */
  .signal .cue { font-size: 26px; min-height: 94px; } /* do 3 linii pytania (v5: dłuższe pytania także na 360–390 px): karty pod spodem nie drgają */
  .signal.wait .cue { color: var(--muted); font-size: 22px; }

  /* Choice chips */
  .chips3 { display: flex; gap: 8px; margin-top: 6px; }
  .chips3 button { flex: 1; background: #fff; color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; }
  .chips3 button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 389px) { .chips3 { gap: 6px; } .chips3 button { min-width: 0; padding: 12px 4px; font-size: 15px; } } /* węższe niż 390 px (320–375): „częściowo” mieści się obok „tak” i „nie” */
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .tags button { min-height: 44px; padding: 8px 12px; background: #fff; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; font-size: 15px; }

  /* Topic card */
  .topic { background: var(--soft); border-radius: 12px; padding: 12px; margin: 0 0 8px; }
  .topic .tag { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .topic .q { font-size: 19px; font-weight: 600; margin: 4px 0 8px; line-height: 1.35; }
  .topic .ctl { display: flex; gap: 8px; align-items: center; }
  .topic .ctl .ghost { flex: 1; }
  .seg { display: flex; border: 1.5px solid var(--accent); border-radius: 12px; overflow: hidden; }
  .seg button { min-width: 56px; border-radius: 0; background: #fff; color: var(--accent); padding: 10px 14px; }
  .seg button.on { background: var(--accent); color: #fff; }

  /* Tally */
  .tally { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .tally button { min-height: 60px; background: #fff; color: var(--ink); border: 1.5px solid var(--line); font-size: 17px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tally button b { font-size: 22px; color: var(--accent); }

  /* Forms */
  input[type=text], textarea, select { font: inherit; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 44px; color: var(--ink); }
  textarea { min-height: 90px; resize: vertical; }
  label.f { display: block; font-size: 14px; color: var(--muted); margin-top: 10px; }
  label.f > * { margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .02em; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

  .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
  .metrics div { background: var(--soft); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .metrics b { display: block; font-size: 20px; }
  .metrics span { font-size: 14px; color: var(--muted); }
  .result { margin-top: 12px; font-size: 15px; white-space: pre-wrap; }
  .result.md { white-space: normal; }
  .result h4 { margin: 12px 0 4px; font-size: 16px; color: var(--accent); }
  .result h4:first-child { margin-top: 0; }
  .result table { font-size: 14px; }
  .result th { background: var(--soft); color: var(--ink); font-weight: 700; text-transform: none; letter-spacing: 0; }
  .result ul { margin: 4px 0; padding-left: 20px; }
  .status { font-size: 14px; color: var(--muted); margin-top: 8px; min-height: 20px; }
  .status.err { color: var(--warn); }
  .fallback { margin-top: 8px; }
  .fallback textarea { font-size: 14px; min-height: 120px; }

  .stat { display: flex; gap: 10px; }
  .stat div { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 28px; line-height: 1.1; }
  .stat span { font-size: 14px; color: var(--muted); }
  svg.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
  .legend { display: flex; gap: 14px; font-size: 14px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .hitem { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hitem:last-child { border-bottom: 0; }
  .hitem .hn { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .alist .item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .alist .item:last-child { border-bottom: 0; }
  .alist .meta { color: var(--muted); font-size: 14px; }
  .alist details summary { cursor: pointer; color: var(--accent); font-size: 15px; min-height: 44px; display: flex; align-items: center; }

  /* Cheat sheet */
  ol.steps { margin: 6px 0 0; padding-left: 0; list-style: none; counter-reset: s; }
  ol.steps li { position: relative; padding: 8px 0 8px 40px; border-bottom: 1px solid var(--line); counter-increment: s; }
  ol.steps li:last-child { border-bottom: 0; }
  ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 7px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  ul.rules { margin: 6px 0 0; padding-left: 20px; }
  ul.rules li { margin: 6px 0; }
  .contact { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .contact:last-child { border-bottom: 0; }
  .contact a { color: var(--accent); font-weight: 700; text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; padding: 0 10px; border: 1px solid var(--accent); border-radius: 12px; }
  .contact span { font-size: 14px; color: var(--muted); display: block; }

  /* Tab bar */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 10; transition: transform .15s; }
  body.kb nav.tabs { transform: translateY(110%); }
  nav.tabs button { flex: 1; background: transparent; color: var(--muted); border-radius: 0; padding: 6px 2px; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
  .toast.on { opacity: .95; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
  .footer { text-align: center; color: var(--muted); font-size: 14px; margin: 20px 0 8px; }

  /* Island map */
  .back { display: inline-flex; align-items: center; gap: 4px; background: transparent; color: var(--accent); padding: 10px 8px 10px 0; font-weight: 600; min-height: 44px; }
  .mapline { font-size: 15px; color: var(--accent); font-weight: 600; margin: 4px 0 8px; min-height: 22px; }
  .mapwrap { margin: 6px -12px 0; background: #cfe0db; border-radius: 18px 18px 0 0; }
  svg.map { display: block; width: 100%; height: auto; font-family: inherit; }
  .island { cursor: pointer; }
  .island:focus { outline: none; }
  .island:focus-visible .isl { stroke: #1f2328; stroke-width: 3; }
  .island .isl { fill: #fff; stroke: var(--accent); stroke-width: 2.5; }
  .island .num { font-size: 15px; font-weight: 700; fill: var(--accent); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .island.st-done .isl { fill: var(--accent); }
  .island.st-done .num { fill: #fff; }
  .island.st-locked .isl { fill: #dedbd2; stroke: #c9c5b9; }
  .island.st-locked .num { fill: #8a8f93; }
  .island.st-today .isl { stroke-width: 3; }
  .island .ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .9; }
  .island .pulse { fill: none; stroke: var(--accent); stroke-width: 3; opacity: .55; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.45); opacity: 0; } }
  .island.pop .isl { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .island .pulse { animation: none; opacity: .35; } .island.pop .isl { animation: none; } }
  .lbl { font-size: 14px; fill: var(--muted); text-anchor: middle; pointer-events: none; }
  .lbl.b { fill: var(--accent); font-weight: 700; }
  .aname { font-size: 16px; font-weight: 700; fill: var(--ink); }
  .afocus { font-size: 14px; fill: var(--muted); }
  .aprog { font-size: 14px; font-weight: 600; fill: var(--accent); text-anchor: end; }
  .sheet { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px)); background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.14); z-index: 15; display: none; }
  .sheet.on { display: block; }
  .sheet h2 { margin: 0 0 6px; font-size: 17px; }
  .sheet p { margin: 4px 0; font-size: 15px; }
  .sheet ul { margin: 6px 0 10px; padding-left: 20px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <section id="s-dzis" class="screen"></section>
  <section id="s-ocena" class="screen"></section>
  <section id="s-postepy" class="screen"></section>
  <section id="s-sciagawka" class="screen"></section>
</main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-label="Zablokowany dzień"></div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtClock(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); }
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
  function todayKey() { return dateKey(new Date()); }
  var DAY1 = '2026-11-07';
  function dayIndex(k) { return Math.round((parseKey(k) - parseKey(DAY1)) / 86400000) + 1; }
  function weekOf(day) { return Math.min(12, Math.max(1, Math.ceil(day / 7))); } // R3 v3: po dniu 84 zostaje archipelag 12 (Utrzymanie)
  function fmtDate(k) {
    try { return parseKey(k).toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' }); }
    catch (e) { return k; }
  }
  function pick(arr, seed) { return arr[Math.abs(seed) % arr.length]; }
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function clampSR(v) { var n = Math.round(Number(v)); if (isNaN(n)) return null; return Math.max(0, Math.min(8, n)); }
  function num(v, dflt) { var n = parseInt(v, 10); return isNaN(n) ? dflt : Math.max(0, n); }
  var toastT = null;
  function toast(msg) {
    var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on');
    if (toastT) clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 1300);
  }

  /* ---------- state ---------- */
  var KEY = 'plynnosc';
  var HIER = [

      if (status === 'wait') { status = 'answer'; endAt = Date.now() + SIGNAL_ANSWER * 1000; beep(false); draw(); return; }
      if (status === 'answer') {
        idx++; if (opts.onRep) opts.onRep(idx);
        if (idx >= n) { stop(); status = 'done'; beep(true); draw(); if (opts.onDone) opts.onDone(); return; }
        toWait(); draw();
      }
    }
    function run() { stop(); iv = setInterval(tick, 200); }
    function stop() { if (iv) clearInterval(iv); iv = null; }
    function toggle() {
      primeAudio();
      if (status === 'wait' || status === 'answer') { paused = status; status = 'pause'; stop(); draw(); return; }
      if (status === 'pause') { toWait(); run(); draw(); return; }
      if (status === 'done') { idx = 0; if (opts.onReset) opts.onReset(); }
      if (opts.onStart) opts.onStart();
      toWait(); run(); draw();
    }
    draw();
    return self;
  }

  function TopicCard(container, m, onChange, opts) {
    // m = day.monolog albo day.extra (mutated): {topic, lang}. opts.fixedLang: bez przełącznika PL/EN (★); opts.avoid(): tematy do pominięcia przy „Inny temat”.

    var seg = opts.fixedLang ? null : h('div', { class: 'seg', role: 'group', 'aria-label': 'Język monologu' });
    var langNote = h('div', { class: 'note langnote' + (opts.langNote ? '' : ' hidden'), text: opts.langNote || '' });

    if (seg) ['pl', 'en'].forEach(function (L) {
      segBtns[L] = h('button', { type: 'button', text: L.toUpperCase(), onclick: function () { if (m.lang === L) return; m.lang = L; onChange(); draw(); } });
      seg.appendChild(segBtns[L]);

    var otherBtn = h('button', { class: 'ghost', type: 'button', text: 'Inny temat', onclick: function () {
      m.topic = randomTopic([m.topic].concat(opts.avoid ? opts.avoid() : [])); onChange(); draw();

      qEl.textContent = m.lang === 'en' ? t[2] : t[1];
      if (seg) ['pl', 'en'].forEach(function (L) { segBtns[L].classList.toggle('on', m.lang === L); segBtns[L].setAttribute('aria-pressed', m.lang === L ? 'true' : 'false'); });
    }
